server:
  port: 8080

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5433/sage_db
    username: sage
    password: sage

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sage:
  kafka:
    topics:
      metrics: sage.metrics